[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -q --strict-markers
markers =
    unit: pure logic, no database required
    flow: end-to-end through HTTP against a real database
filterwarnings =
    ignore::DeprecationWarning:passlib.*
    ignore::DeprecationWarning:fastapi.*
