global:
  scrape_interval: 15s
scrape_configs:
  - job_name: saiv-exporter
    static_configs:
      - targets: ['metrics-exporter:9101']
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8889']
