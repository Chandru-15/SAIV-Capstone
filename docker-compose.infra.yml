# Shared infrastructure only, for running the four application modules on the
# host in their own virtualenvs.
#
# What this file deliberately does NOT contain: backend, face-recognition,
# frontend, metrics-exporter, dashboard. Those are the modules you develop, so
# they run on the host. Because no service here depends on them, naming
# grafana no longer drags the backend in the way it does with
# docker-compose.yml (grafana -> metrics-exporter -> backend).
#
# `name: capstone` matches the project name docker-compose.yml already derives
# from this directory, so this file REUSES the existing capstone_postgres_data,
# capstone_grafana_data and capstone_prometheus_data volumes instead of
# creating a second, empty set. Do not rename it unless you mean to start from
# an empty database.
#
# Ports are published on the host at the same numbers docker-compose.yml uses,
# so module .env.local files work unchanged: postgres 5434, redis 6380,
# prometheus 9090, grafana 3001, mailpit 1025 (SMTP) and 8025 (web UI).
name: capstone

services:
  postgres:
    image: postgres:15-alpine
    container_name: saiv-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-saiv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-saiv_password}
      POSTGRES_DB: ${POSTGRES_DB:-saiv}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-saiv} -d ${POSTGRES_DB:-saiv}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - saiv-network

  redis:
    image: redis:7-alpine
    container_name: saiv-redis
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - saiv-network

  migrate:
    image: postgres:15-alpine
    container_name: saiv-migrate
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-saiv_password}
    volumes:
      - ./db:/db:ro
    command: psql -h postgres -U ${POSTGRES_USER:-saiv} -d ${POSTGRES_DB:-saiv} -v ON_ERROR_STOP=1 -f /db/schema.sql
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - saiv-network
    restart: "no"

  prometheus:
    image: prom/prometheus:latest
    container_name: saiv-prometheus
    ports:
      - "9090:9090"
    volumes:
      # The one real difference from docker-compose.yml: a scrape config whose
      # targets are host.docker.internal rather than compose service names,
      # because the things being scraped now run on the host.
      - ./module4-observability/prometheus.local.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - saiv-network

  grafana:
    image: grafana/grafana:latest
    container_name: saiv-grafana
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:-admin}
      GF_SECURITY_ALLOW_EMBEDDING: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_COOKIE_SAMESITE: disabled
      GF_USERS_DEFAULT_THEME: dark
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/provisioning/dashboards/json/saiv-ops.json
    volumes:
      - grafana_data:/var/lib/grafana
      - ./module4-observability/grafana/provisioning:/etc/grafana/provisioning
    # metrics-exporter is NOT listed here, unlike docker-compose.yml. Grafana
    # reads Prometheus, never the exporter directly; the exporter is only a
    # scrape target, and it now lives on the host.
    depends_on:
      - prometheus
    networks:
      - saiv-network

  # Local mail catcher, so password-reset codes are actually delivered without
  # an account anywhere. Accepts SMTP on 1025 and shows what it received in a
  # web UI on 8025; nothing it receives ever leaves this machine. Point
  # SMTP_HOST at a real provider in .env to send for real instead.
  mailpit:
    image: axllent/mailpit:v1.33
    container_name: saiv-mailpit
    ports:
      - "1025:1025"   # SMTP, what the backend talks to
      - "8025:8025"   # web UI, where you read the code
    environment:
      MP_MAX_MESSAGES: 500
      # Accept any login, and accept it without TLS. Mailpit is a local sink,
      # and this keeps it working if SMTP_USER is left set from a real provider.
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    networks:
      - saiv-network

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

networks:
  saiv-network:
    driver: bridge
