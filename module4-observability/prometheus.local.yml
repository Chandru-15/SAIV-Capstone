# Scrape config for the local-venv workflow (docker-compose.infra.yml).
#
# Identical to prometheus.yml except for the targets: the backend, face
# service and exporter run on the host rather than in compose, so Prometheus
# reaches them through host.docker.internal, which Colima maps to the host
# (verified: 192.168.5.2, TCP reachable).
#
# Job names are kept byte-identical to prometheus.yml on purpose, so the
# provisioned Grafana dashboards match series without edits.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'saiv-backend'
    static_configs:
      - targets: ['host.docker.internal:8000']
    metrics_path: '/metrics'

  - job_name: 'saiv-face-recognition'
    static_configs:
      - targets: ['host.docker.internal:8001']
    metrics_path: '/metrics'

  - job_name: 'saiv-exporter'
    static_configs:
      - targets: ['host.docker.internal:9101']
    metrics_path: '/metrics'

  # Prometheus itself is still in the container, so this one stays localhost.
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
